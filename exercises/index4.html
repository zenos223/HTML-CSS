<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>CSS Exercises</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
        <style>
            nav > div {
                display: inline-block;
            }
            nav > div:last-child {
                float: right;
            }
            nav > div ul {
                list-style-type: none;
                padding: 0px;
            }
            nav > div ul li {
                float: left;
                background: purple;
                padding: 10px 30px;
                margin: 0px 10px;
            }
            nav > div ul li a {
                color: aliceblue;
                text-decoration: none;
            }

            section > div {
                width: 48%;
                float: left;
            }
            section > div:first-child {
                margin-right: 2%;
            }
            section > div:last-child {
                margin-left: 2%;
            }
            section img {
                width: 250px;
                height: 200px;
                display: block;
                margin: 15px auto;
            }
            section > div:nth-child(2) > ul {
                list-style-type: none;
            }
            section > div:nth-child(2) > ul li {
                margin: 30px 0px;
                font-size: 20px;
            }


            footer {
                clear: left;
                background: black;
                color: aliceblue;
                height: 50px;
                text-align: center;
               line-height: 50px; 

            }
        </style>
    </head>
    <body>
        <nav>
            <div>
                <ul>
                    <li><a href="">Home</a></li>
                    <li><a href="">About</a></li>
                    <li><a href="">Service</a></li>
                    <li><a href="">Contact</a></li>
                </ul>
            </div>
            <div>
                <ul>
                    <li><a href="">Login</a></li>
                    <li><a href="">Register</a></li>
                </ul>
            </div>
        </nav>

        <section>
            <div>
                <img src="../image/anime.jpg" alt="">
                <img src="../image/anime.jpg" alt="">
                <img src="../image/anime.jpg" alt="">
            </div>
            <div>
                <ul>
                    <li>item 1</li>
                    <li>item 2</li>
                    <li>item 3</li>
                    <li>item 4</li>
                    <li>item 5</li>
                    <li>item 6</li>
                </ul>
            </div>
        </section>

        <footer>Footer</footer>
        <script src="" async defer></script>
    </body>
</html>
